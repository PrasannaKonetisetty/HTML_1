<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Page 1</title>
  <link rel="stylesheet" href="panda.css">
</head>
<body>
  <div class="form-container">
    <h1>Student Registration Form</h1>
    <p class="step">Step 1 of 2: Personal Information</p>

    <form action="register.html" method="get">
      <fieldset>
        <legend>Personal Details</legend>
        <label>First Name *</label>
        <input type="text" name="first_name" required>

        <label>Last Name *</label>
        <input type="text" name="last_name" required>

        <label>Date of Birth *</label>
        <input type="date" name="dob" required>
        
         <div class="gender-group">
  <label>Gender :</label>
  <label><input type="radio" name="gender" value="male"> Male</label>
  <label><input type="radio" name="gender" value="female"> Female</label>
  <label><input type="radio" name="gender" value="other"> Other</label>
</div>

        <br>

        <label>Phone *</label>
        <input type="tel" name="phone" required>

        <label>Email *</label>
        <input type="email" name="email" required>
      </fieldset>

      <fieldset>
        <legend>Address</legend>
        <label>Current Address *</label>
        <textarea name="current_address" rows="3" required></textarea>

        <label>Mailing Address</label>
        <textarea name="mailing_address" rows="3"></textarea>
      </fieldset>

      <fieldset>
        <legend>Emergency Contact</legend>
        <label>Name *</label>
        <input type="text" name="emg_name" required>

        <label>Relation *</label>
        <input type="text" name="emg_relation" required>

        <label>Phone *</label>
        <input type="tel" name="emg_phone" required>
      </fieldset>

      <button type="submit" class="btn">Next →</button>
    </form>
  </div>
</body>
</html>
