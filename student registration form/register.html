<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Page 2</title>
  <link rel="stylesheet" href="panda.css">
</head>
<body>
  <div class="form-container">
    <h1>Student Registration Form</h1>
    <p class="step">Step 2 of 2: Academic Information</p>

    <form action="last.html" method="get">
      <fieldset>
        <legend>Academic Background</legend>
        <label>INSTITUTE NAME *</label>
        <input type="text" name="previous_school" required>

        <label>GPA / Percentage *</label>
        <input type="text" name="gpa" required>
      </fieldset>

      <fieldset>
        <legend>Program / Course Selection</legend>
        <label>Select Program *</label>
        <select name="program" required>
          <option value="">-- Select --</option>
          <option>B.Tech</option>
          <option>B.Sc</option>
          <option>BBA</option>
          <option>M.Tech</option>
          <option>Diploma</option>
        </select>

        <label>Select Branch *</label>
        <select name="branch" required>
          <option value="">-- Select --</option>
          <option>CSE</option>
          <option>IT</option>
          <option>ECE</option>
          <option>Civil</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Declaration</legend>
        <label><input type="checkbox" required> I declare that all the information is correct.</label>
      </fieldset>

      <div class="btn-group">
        <a href="index.html" class="btn">← Back</a>
        <button type="submit" class="btn">Submit</button>
      </div>
    </form>
  </div>
</body>
</html>
